[project]
name = "copier-python-package-template"
version = "0.1.0"
description = "Copier template for creating Python libraries and executables"
readme = "README.md"
requires-python = ">=3.12.7"
dependencies = [
    # Specific to this template


    # Managed by upstream template
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "faker>=40.41.0",
    "pyrefly==1.4.0",
    "copier==9.18.2",
    "copier-template-extensions==0.3.3"
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
exclude-newer = "1 day"

[tool.tach]
source_roots = ["src", "."]
exclude = [".venv", "**/__pycache__", "**/*.egg-info", "template", "mutants", "copier_template_resources"]

[[tool.tach.modules]]
path = "tests.**.conftest"
depends_on = ["tests"]
# Never import from a conftest.py (https://docs.pytest.org/en/stable/how-to/writing_plugins.html#conftest-py-local-per-directory-plugins);
# put shared helpers in a regular module instead.
visibility = []

# Declared so tach checks the tests' imports; a file outside every module is never checked.
[[tool.tach.modules]]
path = "tests"
depends_on = []

[tool.tach.external]
# Tooling run from the command line or as pytest plugins, or imported only by the tests (which check-external skips)
exclude = ["copier", "faker", "pyrefly", "pytest", "pytest_cov", "pytest_randomly"]
